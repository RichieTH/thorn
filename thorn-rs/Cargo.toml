[package]
name = "thorn-scan"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Security scanner for secrets, misconfigs, and committed .env files"
license = "MIT"
repository = "https://github.com/RichieTH/thorn"
keywords = ["security", "secrets", "scanner", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "thorn"
path = "src/main.rs"

[dependencies]
walkdir = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
