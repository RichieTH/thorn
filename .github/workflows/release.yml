name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-rust:
    name: thorn-rs (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linker: aarch64-linux-gnu-gcc
            apt_package: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        working-directory: thorn-rs
    # Forces curve25519-dalek's portable backend -- see the matching comment in
    # ci.yml's thorn-rs job for the full explanation (short version: avoids a
    # proc-macro dependency that failed to load during local release-build
    # testing on Windows, most likely due to Smart App Control rather than a
    # real bug -- kept regardless since it's a strictly smaller, free win).
    env:
      RUSTFLAGS: --cfg curve25519_dalek_backend="serial"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "thorn-rs -> target"
          key: ${{ matrix.target }}

      - name: install cross-compiler
        if: matrix.apt_package
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_package }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../thorn-rs-${{ matrix.target }}.tar.gz thorn

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/thorn.exe -DestinationPath thorn-rs-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: thorn-rs-${{ matrix.target }}
          path: |
            thorn-rs/thorn-rs-${{ matrix.target }}.tar.gz
            thorn-rs/thorn-rs-${{ matrix.target }}.zip
          if-no-files-found: ignore
          retention-days: 1

  build-go:
    name: thorn-go (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    defaults:
      run:
        working-directory: thorn-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: thorn-go/go.sum

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o "thorn${ext}" ./cmd/thorn

      - name: package (unix)
        if: matrix.goos != 'windows'
        run: tar czf thorn-go-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz thorn

      - name: package (windows)
        if: matrix.goos == 'windows'
        run: zip thorn-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip thorn.exe

      - uses: actions/upload-artifact@v7
        with:
          name: thorn-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            thorn-go/thorn-go-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            thorn-go/thorn-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: ignore
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build-rust, build-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "thorn-rs -> target"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: sign checksums (GPG)
        working-directory: dist
        run: |
          echo "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --local-user releases@thorn.dev --detach-sign --armor \
            -o checksums.txt.asc checksums.txt
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}

      - name: sign checksums (ML-DSA / Dilithium)
        working-directory: thorn-rs
        run: |
          cargo run --quiet --example sign_checksums \
            < ../dist/checksums.txt \
            > ../dist/checksums.txt.dilithium
        env:
          THORN_DILITHIUM_PRIVATE_KEY: ${{ secrets.RELEASE_DILITHIUM_PRIVATE_KEY }}

      - name: verify signatures before publishing
        run: |
          cd dist
          gpg --verify checksums.txt.asc checksums.txt
          echo "GPG signature verified."
          cargo run --quiet --manifest-path ../thorn-rs/Cargo.toml -- \
            verify-release thorn-rs-x86_64-unknown-linux-gnu.tar.gz \
            --checksums checksums.txt --signature checksums.txt.dilithium

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
